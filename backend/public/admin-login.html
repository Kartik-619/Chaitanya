<!DOCTYPE html>
<head>
    <title>Admin Login - TechFest</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 100px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; margin-top: 10px; }
        .success { color: green; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>🔐 Admin Login</h2>
    
    <!-- Login Form -->
    <div class="form-group">
        <label>Email:</label>
        <input type="email" id="email" placeholder="admin@techfest.com">
    </div>
    <div class="form-group">
        <label>Password:</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>
    <button id="loginBtn">Login</button>
    
    <!-- Status Messages -->
    <div id="message"></div>

    <script>
    // Simple login function
    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('message');

        if (!email || !password) {
            messageDiv.innerHTML = '<div class="error">Please fill all fields</div>';
            return;
        }

        try {
            messageDiv.innerHTML = '<div style="color: blue;">🔄 Logging in...</div>';

            const response = await fetch('/api/admin/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            const result = await response.json();
            console.log('🔍 Login response:', result);

            if (result.success) {
                // Store authentication data
                localStorage.setItem('adminToken', result.token);
                localStorage.setItem('adminUser', JSON.stringify(result.user));
                
                messageDiv.innerHTML = '<div class="success">✅ Login successful! Redirecting...</div>';
                
                // Force redirect after short delay
                setTimeout(() => {
                    console.log('🚀 Redirecting to dashboard...');
                    window.location.href = '/admin-dashboard.html';
                }, 1000);
                
            } else {
                throw new Error(result.message);
            }
            
        } catch (error) {
            console.error('❌ Login error:', error);
            messageDiv.innerHTML = `<div class="error">Login failed: ${error.message}</div>`;
        }
    }

    // Check if already logged in
    function checkExistingAuth() {
        const token = localStorage.getItem('adminToken');
        const user = localStorage.getItem('adminUser');
        
        if (token && user) {
            console.log('✅ Already logged in - redirecting to dashboard');
            window.location.href = '/admin-dashboard.html';
        }
    }

    // Initialize login page
    document.addEventListener('DOMContentLoaded', function() {
        console.log('✅ Login page loaded');
        checkExistingAuth();
        
        document.getElementById('loginBtn').addEventListener('click', login);
        
        // Enter key to login
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                login();
            }
        });
    });
</script>
</body>
</html>
